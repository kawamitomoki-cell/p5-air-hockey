<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER AIR HOCKEY - 別端末QR対戦</title>
  
  <!-- p5.js, PeerJS, QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      user-select: none;
      touch-action: none; /* スマホのスクロール暴発防止 */
    }
    #ui-bar {
      width: 100%;
      max-width: 700px;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 4px;
      background: #475569;
      color: #fff;
      font-weight: bold;
    }
    .badge.online { background: #10b981; }

    #canvas-container {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }

    /* QRコード表示モーダル（待機時） */
    #qr-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      z-index: 100;
    }
    #qrcode {
      background: #fff;
      padding: 8px;
      border-radius: 6px;
    }
    #qr-modal p {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
    }
    #copy-url-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    #guide {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="ui-bar">
    <div style="font-weight: 900; letter-spacing: 1px;">AIR HOCKEY <span style="color:#38bdf8;">P2P</span></div>
    <div id="status-badge" class="badge">相手の接続を待機中...</div>
  </div>

  <div id="canvas-container"></div>
  <div id="guide">操作: <strong>画面を上下にドラッグ / スワイプ</strong> または <strong>W/S / 矢印キー</strong></div>

  <!-- QRコード表示エリア（別端末で読み取る用） -->
  <div id="qr-modal">
    <h3 style="color:#38bdf8; font-size:16px;">スマホでQRをスキャンして参戦！</h3>
    <div id="qrcode"></div>
    <p>同じURLを別のPCで開いて対戦も可能</p>
    <button id="copy-url-btn">対戦URLをコピー</button>
  </div>

  <script>
    // ========================================================
    // サウンド (Web Audio API)
    // ========================================================
    let audioCtx = null;
    function playBeep(freq, dur) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    // ========================================================
    // ゲーム設定 & p5.js
    // ========================================================
    const GAME_W = 700;
    const GAME_H = 400;

    let p1 = { y: 160, h: 80, score: 0 }; // ホスト (赤・左)
    let p2 = { y: 160, h: 80, score: 0 }; // ゲスト (青・右)
    let ball = { x: 350, y: 200, vx: 5, vy: 3, r: 10 };

    let role = "offline";
    let isConnected = false;
    let peer = null;
    let conn = null;

    function setup() {
      let canvas = createCanvas(GAME_W, GAME_H);
      canvas.parent('canvas-container');
      initNetworking();
    }

    function draw() {
      background(15, 23, 42);

      // センターライン
      stroke(30, 41, 59);
      strokeWeight(3);
      for (let y = 0; y < height; y += 20) {
        line(width / 2, y, width / 2, y + 10);
      }

      // 1. 操作入力（キーボード & スマホのタッチ両対応）
      let moveSpeed = 7;
      let myPaddle = (role === "guest") ? p2 : p1;

      // キーボード
      if (keyIsDown(87) || keyIsDown(UP_ARROW)) myPaddle.y = max(10, myPaddle.y - moveSpeed);
      if (keyIsDown(83) || keyIsDown(DOWN_ARROW)) myPaddle.y = min(height - myPaddle.h - 10, myPaddle.y + moveSpeed);

      // タッチ / マウスドラッグ操作 (追従)
      if (mouseIsPressed && mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
        myPaddle.y = constrain(mouseY - myPaddle.h / 2, 10, height - myPaddle.h - 10);
      }

      // 2. ゲームロジック
      if (role === "host") {
        if (isConnected) {
          ball.x += ball.vx;
          ball.y += ball.vy;

          // 上下壁バウンド
          if (ball.y - ball.r < 0 || ball.y + ball.r > height) {
            ball.vy *= -1;
            playBeep(260, 0.06);
          }

          // P1 (左) 衝突
          if (ball.x - ball.r < 30 && ball.x + ball.r > 15) {
            if (ball.y > p1.y && ball.y < p1.y + p1.h) {
              ball.vx = abs(ball.vx) * 1.05;
              ball.vy += (ball.y - (p1.y + p1.h / 2)) * 0.12;
              ball.x = 30 + ball.r;
              playBeep(440, 0.08);
            }
          }

          // P2 (右) 衝突
          if (ball.x + ball.r > width - 30 && ball.x - ball.r < width - 15) {
            if (ball.y > p2.y && ball.y < p2.y + p2.h) {
              ball.vx = -abs(ball.vx) * 1.05;
              ball.vy += (ball.y - (p2.y + p2.h / 2)) * 0.12;
              ball.x = width - 30 - ball.r;
              playBeep(440, 0.08);
            }
          }

          // 得点
          if (ball.x < 0) { p2.score++; resetBall(1); }
          else if (ball.x > width) { p1.score++; resetBall(-1); }

          // ゲストへ状態送信
          if (conn && conn.open) {
            conn.send({
              type: "sync",
              p1Y: p1.y,
              ballX: ball.x,
              ballY: ball.y,
              p1Score: p1.score,
              p2Score: p2.score
            });
          }
        }
      } else if (role === "guest") {
        // ゲストは自分のパドル座標だけをホストへ送信
        if (conn && conn.open) {
          conn.send({ type: "guest_paddle", y: p2.y });
        }
      }

      // 3. 描画
      // スコア
      fill(255, 255, 255, 70);
      textSize(50);
      textStyle(BOLD);
      textAlign(CENTER, TOP);
      text(p1.score, width / 2 - 80, 25);
      text(p2.score, width / 2 + 80, 25);

      // パドル P1 (赤) & P2 (青)
      noStroke();
      fill('#ff3366');
      rect(15, p1.y, 15, p1.h, 6);

      fill('#00d2ff');
      rect(width - 30, p2.y, 15, p2.h, 6);

      // ボール
      fill('#facc15');
      ellipse(ball.x, ball.y, ball.r * 2);
    }

    function resetBall(dir) {
      ball.x = width / 2;
      ball.y = height / 2;
      ball.vx = dir * 5;
      ball.vy = random(-3, 3);
      playBeep(180, 0.25);
    }

    // ========================================================
    // 通信 & QRコード処理
    // ========================================================
    function initNetworking() {
      // URLに ?room=ID があるかチェック (あるなら自分はゲスト)
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoom = urlParams.get('room');

      peer = new Peer();

      peer.on('open', (id) => {
        if (targetRoom) {
          // --- ゲスト側の処理 ---
          role = "guest";
          document.getElementById('qr-modal').style.display = 'none';
          document.getElementById('status-badge').innerText = "ホストへ接続中...";
          conn = peer.connect(targetRoom);
          setupEvents();
        } else {
          // --- ホスト側の処理 (QRコード生成) ---
          role = "host";
          const currentUrl = window.location.origin + window.location.pathname;
          const joinUrl = `${currentUrl}?room=${id}`;

          // QRコード作成
          new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 140,
            height: 140
          });

          // コピー用ボタン
          document.getElementById('copy-url-btn').onclick = () => {
            navigator.clipboard.writeText(joinUrl).then(() => alert("対戦URLをコピーしました！"));
          };

          // ゲストからの接続待ち
          peer.on('connection', (c) => {
            conn = c;
            setupEvents();
          });
        }
      });
    }

    function setupEvents() {
      conn.on('open', () => {
        isConnected = true;
        document.getElementById('qr-modal').style.display = 'none'; // QRを閉じる
        const badge = document.getElementById('status-badge');
        badge.innerText = role === "host" ? "ONLINE: HOST (赤・左)" : "ONLINE: GUEST (青・右)";
        badge.classList.add('online');
      });

      conn.on('data', (data) => {
        if (role === "host" && data.type === "guest_paddle") {
          p2.y = data.y;
        } else if (role === "guest" && data.type === "sync") {
          p1.y = data.p1Y;
          ball.x = data.ballX;
          ball.y = data.ballY;
          p1.score = data.p1Score;
          p2.score = data.p2Score;
        }
      });

      conn.on('close', () => {
        isConnected = false;
        const badge = document.getElementById('status-badge');
        badge.innerText = "相手が切断しました";
        badge.classList.remove('online');
      });
    }
  </script>
</body>
</html>
