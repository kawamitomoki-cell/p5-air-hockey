<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER AIR HOCKEY P2P</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      user-select: none;
      touch-action: none;
    }
    #ui-bar {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border: 1px solid #334155;
    }
    #status-text {
      font-size: 13px;
      font-weight: bold;
      color: #facc15;
    }
    #canvas-container {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
    #qr-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      z-index: 100;
    }
    #qrcode {
      background: #fff;
      padding: 8px;
      border-radius: 6px;
    }
    #guide {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="ui-bar">
    <div style="font-weight: bold; color: #38bdf8;">AIR HOCKEY ONLINE</div>
    <div id="status-text">通信初期化中...</div>
  </div>

  <div id="canvas-container"></div>
  <div id="guide">操作: 画面を上下にスワイプ / ドラッグ、または W/S キー</div>

  <div id="qr-modal" style="display: none;">
    <h4 style="color:#38bdf8;">スマホで読み取って対戦！</h4>
    <div id="qrcode"></div>
    <div style="font-size: 11px; color:#94a3b8;">カメラをかざすと自動で部屋に入ります</div>
  </div>

  <script>
    let audioCtx = null;
    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const GAME_W = 650;
    const GAME_H = 380;

    let p1 = { y: 150, h: 80, score: 0 };
    let p2 = { y: 150, h: 80, score: 0 };
    let ball = { x: 325, y: 190, vx: 5, vy: 3, r: 9 };

    let role = "unknown";
    let conn = null;
    let peer = null;

    function setup() {
      let canvas = createCanvas(GAME_W, GAME_H);
      canvas.parent('canvas-container');
      initNetwork();
    }

    function draw() {
      background(15, 23, 42);

      stroke(30, 41, 59);
      strokeWeight(2);
      for (let y = 0; y < height; y += 15) {
        line(width / 2, y, width / 2, y + 8);
      }

      let myPaddle = (role === "guest") ? p2 : p1;
      
      if (keyIsDown(87) || keyIsDown(UP_ARROW)) myPaddle.y = max(10, myPaddle.y - 7);
      if (keyIsDown(83) || keyIsDown(DOWN_ARROW)) myPaddle.y = min(height - myPaddle.h - 10, myPaddle.y + 7);

      if (mouseIsPressed && mouseY >= 0 && mouseY <= height) {
        myPaddle.y = constrain(mouseY - myPaddle.h / 2, 10, height - myPaddle.h - 10);
      }

      if (role === "host") {
        if (conn && conn.open) {
          ball.x += ball.vx;
          ball.y += ball.vy;

          if (ball.y - ball.r < 0 || ball.y + ball.r > height) {
            ball.vy *= -1;
            playBeep(260, 0.05);
          }

          if (ball.x - ball.r < 30 && ball.x + ball.r > 15) {
            if (ball.y > p1.y && ball.y < p1.y + p1.h) {
              ball.vx = abs(ball.vx) * 1.05;
              ball.vy += (ball.y - (p1.y + p1.h / 2)) * 0.12;
              ball.x = 30 + ball.r;
              playBeep(440, 0.08);
            }
          }

          if (ball.x + ball.r > width - 30 && ball.x - ball.r < width - 15) {
            if (ball.y > p2.y && ball.y < p2.y + p2.h) {
              ball.vx = -abs(ball.vx) * 1.05;
              ball.vy += (ball.y - (p2.y + p2.h / 2)) * 0.12;
              ball.x = width - 30 - ball.r;
              playBeep(440, 0.08);
            }
          }

          if (ball.x < 0) { p2.score++; resetBall(1); }
          else if (ball.x > width) { p1.score++; resetBall(-1); }

          conn.send({
            t: 's',
            p1: p1.y,
            bx: Math.round(ball.x),
            by: Math.round(ball.y),
            s1: p1.score,
            s2: p2.score
          });
        }
      } else if (role === "guest") {
        if (conn && conn.open) {
          conn.send({ t: 'p', y: Math.round(p2.y) });
        }
      }

      fill(255, 255, 255, 60);
      textSize(42);
      textStyle(BOLD);
      textAlign(CENTER, TOP);
      text(p1.score, width / 2 - 70, 20);
      text(p2.score, width / 2 + 70, 20);

      noStroke();
      fill('#ff3366');
      rect(15, p1.y, 14, p1.h, 5);

      fill('#00d2ff');
      rect(width - 29, p2.y, 14, p2.h, 5);

      fill('#facc15');
      ellipse(ball.x, ball.y, ball.r * 2);
    }

    function resetBall(dir) {
      ball.x = width / 2;
      ball.y = height / 2;
      ball.vx = dir * 5;
      ball.vy = random(-3, 3);
      playBeep(180, 0.2);
    }

    function initNetwork() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetHostId = urlParams.get('room');

      // Google公式のSTUNサーバー（厳しいWi-FiやNAT環境のファイアウォールを突破する設定）
      const peerConfig = {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ]
        }
      };

      peer = new Peer(peerConfig);

      peer.on('open', (myId) => {
        if (targetHostId) {
          role = "guest";
          document.getElementById('status-text').innerText = "ホストへ接続中 (ICE通信)...";
          document.getElementById('status-text').style.color = "#38bdf8";

          // 接続開始（バッファ遅延対策設定付き）
          conn = peer.connect(targetHostId, { reliable: false });
          setupGuestConnection();
        } else {
          role = "host";
          document.getElementById('status-text').innerText = "QRスキャン待機中...";
          document.getElementById('status-text').style.color = "#facc15";

          const joinUrl = window.location.href.split('?')[0] + '?room=' + myId;
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 140,
            height: 140
          });
          document.getElementById('qr-modal').style.display = 'flex';

          peer.on('connection', (c) => {
            conn = c;
            setupHostConnection();
          });
        }
      });

      peer.on('error', (err) => {
        document.getElementById('status-text').innerText = "エラー: " + err.type;
        document.getElementById('status-text').style.color = "#ef4444";
      });
    }

    function setupHostConnection() {
      conn.on('open', () => {
        document.getElementById('qr-modal').style.display = 'none';
        document.getElementById('status-text').innerText = "● 対戦中 (赤・左)";
        document.getElementById('status-text').style.color = "#4ade80";
      });

      conn.on('data', (d) => {
        if (d.t === 'p') p2.y = d.y;
      });

      conn.on('close', () => {
        document.getElementById('status-text').innerText = "相手が切断しました";
        document.getElementById('status-text').style.color = "#ef4444";
      });
    }

    function setupGuestConnection() {
      conn.on('open', () => {
        document.getElementById('status-text').innerText = "● 対戦中 (青・右)";
        document.getElementById('status-text').style.color = "#4ade80";
      });

      conn.on('data', (d) => {
        if (d.t === 's') {
          p1.y = d.p1;
          ball.x = d.bx;
          ball.y = d.by;
          p1.score = d.s1;
          p2.score = d.s2;
        }
      });

      conn.on('close', () => {
        document.getElementById('status-text').innerText = "切断されました";
        document.getElementById('status-text').style.color = "#ef4444";
      });
    }
  </script>
</body>
</html>
